<!doctype html>
<html lang="en" data-theme="fallout-green">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typedesk // RobCo CRT Terminal</title>

    <!-- Synchronous Anti-Flash (FOUT) Theme Hydration Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("typedesk-theme");
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed) document.documentElement.setAttribute("data-theme", parsed);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Font Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..
  800&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-(--bg-main) text-(--text-correct) antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
